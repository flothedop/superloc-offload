[package]
name = "superloc-offload"
version = "0.1.0"
edition = "2021"
description = "Copie et vérification de rushs"
authors = ["SuperLoc"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
offload-core = { path = ".." }
fs4 = "0.13"
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperLoc Offload</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Bandeau d'état : porte le verdict et sert lui-même de barre de progression. -->
<header class="bandeau" id="bandeau" data-etat="repos">
  <div class="bandeau__remplissage" id="remplissage"></div>
  <div class="bandeau__contenu">
    <span class="tally" aria-hidden="true"></span>
    <div class="bandeau__texte">
      <h1 class="bandeau__verdict" id="verdict" data-t="pret"></h1>
      <p class="bandeau__detail" id="detail" aria-live="polite" data-t="pret_detail"></p>
    </div>
    <div class="bandeau__droite">
      <div class="bandeau__chiffre cache" id="chiffre">0<span>%</span></div>
      <div class="bandeau__reste mono" id="reste"></div>
    </div>
  </div>
</header>

<nav class="onglets" role="tablist">
  <button role="tab" class="onglet actif" data-vue="decharger" data-t="onglet_decharger"></button>
  <button role="tab" class="onglet" data-vue="verifier" data-t="onglet_verifier"></button>
  <button role="tab" class="onglet" data-vue="historique" data-t="onglet_historique"></button>
  <button role="tab" class="onglet" data-vue="reglages" data-t="onglet_reglages"></button>
  <span class="onglets__file mono cache" id="file-compte"></span>
</nav>

<!-- ======================================================== Décharger -->
<section class="vue" id="vue-decharger">
  <div class="defile">
    <section class="travail">
      <div>
        <div class="etiquette"><span data-t="carte"></span> <span class="compte" id="carte-structure"></span></div>

        <div class="tuiles" id="tuiles"></div>

        <button class="carte-vide" id="carte-vide" type="button">
          <svg class="glyphe-carte" viewBox="0 0 64 46" aria-hidden="true">
            <path class="silhouette" d="M4.75 1.75 h44.5 l13 13 v29.5 a1 1 0 0 1 -1 1 H4.75 a3 3 0 0 1 -3 -3 V4.75 a3 3 0 0 1 3 -3 z"/>
            <rect class="contact" x="8" y="7" width="4" height="13" rx="1.5"/>
            <rect class="contact" x="15" y="7" width="4" height="13" rx="1.5"/>
            <rect class="contact" x="22" y="7" width="4" height="13" rx="1.5"/>
            <rect class="contact" x="29" y="7" width="4" height="13" rx="1.5"/>
          </svg>
          <span class="carte-vide__invite" data-t="deposer"></span>
          <span class="carte-vide__second" data-t="ou_choisir"></span>
        </button>

        <div class="carte-pleine cache" id="carte-pleine">
          <div class="carte-pleine__haut">
            <input class="carte-pleine__nom" id="carte-nom" spellcheck="false" aria-label="Nom de la carte">
            <button class="lien" id="carte-changer" type="button" data-t="changer"></button>
          </div>
          <div class="carte-pleine__chemin mono" id="carte-chemin"></div>
          <div class="carte-pleine__faits">
            <div><div class="fait__valeur" id="fait-clips">0</div><div class="fait__nom" data-t="clips"></div></div>
            <div><div class="fait__valeur" id="fait-fichiers">0</div><div class="fait__nom" data-t="fichiers"></div></div>
            <div><div class="fait__valeur" id="fait-taille">0</div><div class="fait__nom" data-t="a_copier"></div></div>
            <div><div class="fait__valeur" id="fait-camera">—</div><div class="fait__nom" data-t="format"></div></div>
          </div>
          <div class="note cache" id="carte-deja"></div>
          <div class="note note--alerte cache" id="carte-alerte"></div>
        </div>
      </div>

      <div>
        <div class="etiquette"><span data-t="destinations"></span> <span class="compte" id="compte-disques"></span></div>
        <div id="disques"></div>
        <button class="ajouter" id="ajouter" type="button" data-t="ajouter_disque"></button>

        <details class="nommage" id="nommage">
          <summary><span data-t="nommage"></span> <span class="mono nommage__apercu" id="nommage-apercu"></span></summary>
          <div class="champs">
            <label class="champ champ--large"><span data-t="gabarit"></span>
              <input id="gabarit" class="mono" spellcheck="false">
              <small data-t="gabarit_aide"></small>
            </label>
            <label class="champ"><span data-t="projet"></span><input id="projet"></label>
            <label class="champ"><span data-t="jour"></span><input id="jour"></label>
            <label class="champ"><span data-t="camera"></span><input id="camera"></label>
            <label class="champ"><span data-t="operateur"></span><input id="operateur"></label>
          </div>
        </details>
      </div>
    </section>

    <!-- Pendant la copie : débit et avancement de chaque disque. -->
    <section class="debits cache" id="debits"></section>

    <section class="analyse cache" id="analyse" aria-live="polite">
      <div class="analyse__entete">
        <span class="analyse__titre" data-t="pourquoi_lent"></span>
        <button class="lien" id="analyse-fermer" type="button" data-t="masquer"></button>
      </div>
      <div class="analyse__colonnes">
        <div>
          <div class="analyse__sous" data-t="mesure"></div>
          <ul class="analyse__liste" id="analyse-faits"></ul>
        </div>
        <div>
          <div class="analyse__sous" data-t="hypotheses"></div>
          <ol class="analyse__liste analyse__liste--hypo" id="analyse-hypotheses"></ol>
        </div>
      </div>
    </section>

    <section class="resultat cache" id="resultat">
      <div class="resultat__actions">
        <button class="bouton bouton--sobre" id="btn-rapport" type="button" data-t="ouvrir_rapport"></button>
        <button class="bouton bouton--sobre" id="btn-dossier" type="button" data-t="ouvrir_dossier"></button>
        <button class="bouton bouton--sobre" id="btn-ejecter" type="button" data-t="ejecter_carte"></button>
        <button class="bouton bouton--sobre" id="btn-nouvelle" type="button" data-t="nouvelle_copie"></button>
      </div>
      <ul class="resultat__remarques" id="remarques"></ul>
    </section>

    <section class="file cache" id="file">
      <div class="etiquette"><span data-t="file_attente"></span></div>
      <ol id="file-liste"></ol>
    </section>

    <main class="journal">
      <div class="journal__entete">
        <div data-t="fichier"></div>
        <div data-t="clip"></div>
        <div class="droite" data-t="taille"></div>
        <div class="droite" id="entete-dest" data-t="disques"></div>
      </div>
      <div class="journal__corps" id="journal-corps">
        <p class="journal__vide" id="journal-vide" data-t="journal_vide"></p>
      </div>
      <div class="journal__pied mono cache" id="journal-pied"></div>
    </main>
  </div>

  <div class="actions">
    <div class="reglages">
      <label class="reglage"><span data-t="verification"></span>
        <select id="mode">
          <option value="complet" data-t="mode_complet"></option>
          <option value="complet-carte" data-t="mode_carte"></option>
          <option value="taille" data-t="mode_taille"></option>
        </select>
      </label>
      <label class="reglage"><span data-t="empreintes"></span>
        <select id="algos">
          <option value="xxh128,xxh64">xxh128 + xxh64</option>
          <option value="xxh64">xxh64</option>
          <option value="xxh128,xxh64,md5">xxh128 + xxh64 + MD5</option>
          <option value="md5">MD5</option>
        </select>
      </label>
      <label class="reglage"><input type="checkbox" id="mhl1"> <span data-t="mhl1"></span></label>
      <label class="reglage"><input type="checkbox" id="ejecter"> <span data-t="ejecter_fin"></span></label>
    </div>
    <button class="bouton bouton--sobre cache" id="btn-annuler" type="button" data-t="annuler"></button>
    <button class="bouton" id="btn-decharger" type="button" disabled data-t="decharger"></button>
  </div>
</section>

<!-- ========================================================= Vérifier -->
<section class="vue cache" id="vue-verifier">
  <div class="defile page">
    <h2 class="titre-page" data-t="verifier_titre"></h2>
    <p class="texte-page" data-t="verifier_texte"></p>
    <div class="ligne-boutons">
      <button class="bouton" id="btn-verifier" type="button" data-t="choisir_dossier_verifier"></button>
      <button class="bouton bouton--sobre cache" id="btn-verifier-annuler" type="button" data-t="annuler"></button>
    </div>
    <div class="verif cache" id="verif">
      <div class="verif__chemin mono" id="verif-chemin"></div>
      <div class="verif__resume" id="verif-resume"></div>
      <ul class="verif__liste" id="verif-liste"></ul>
    </div>
  </div>
</section>

<!-- ======================================================= Historique -->
<section class="vue cache" id="vue-historique">
  <div class="defile page">
    <h2 class="titre-page" data-t="historique_titre"></h2>
    <p class="texte-page" data-t="historique_texte"></p>
    <table class="tableau" id="historique"></table>
  </div>
</section>

<!-- ========================================================= Réglages -->
<section class="vue cache" id="vue-reglages">
  <div class="defile page">
    <h2 class="titre-page" data-t="onglet_reglages"></h2>
    <div class="champs champs--page">
      <label class="champ"><span data-t="langue"></span>
        <select id="r-langue"><option value="" data-t="langue_systeme"></option><option value="fr">Français</option><option value="en">English</option></select>
      </label>
      <label class="champ"><span data-t="operateur"></span><input id="r-operateur"></label>
      <label class="champ"><span>E-mail</span><input id="r-email" type="email"></label>
      <label class="champ"><span data-t="lieu"></span><input id="r-lieu"></label>
      <label class="reglage"><input type="checkbox" id="r-son"> <span data-t="son_fin"></span></label>
      <label class="reglage"><input type="checkbox" id="r-notification"> <span data-t="notif_fin"></span></label>
    </div>
    <h3 class="sous-titre" data-t="a_propos"></h3>
    <p class="texte-page" id="a-propos"></p>
    <p class="texte-page petit" data-t="avertissement_texte"></p>
  </div>
</section>

<footer class="pied">
  <div id="pied-info"></div>
  <span class="mono" id="version"></span>
</footer>

<dialog id="dialogue-avertissement" class="dialogue">
  <h2 data-t="avertissement_titre"></h2>
  <p data-t="avertissement_texte"></p>
  <ul>
    <li data-t="avertissement_1"></li>
    <li data-t="avertissement_2"></li>
    <li data-t="avertissement_3"></li>
  </ul>
  <div class="ligne-boutons droite"><button class="bouton" id="btn-accepter" type="button" data-t="compris"></button></div>
</dialog>

<script src="i18n.js"></script>
<script src="backend.js"></script>
<script src="app.js"></script>
</body>
</html>

name: Publier une version

# Pousser une étiquette de version (git tag v0.1.0 && git push --tags)
# construit les installeurs Mac et Windows et les attache à une
# publication GitHub, prête à être transmise aux clients.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installeurs:
    name: ${{ matrix.cible }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Un seul installeur Mac, universel : Intel et Apple Silicon.
          # (Les machines macos-13 de GitHub, seules à être Intel, ont été
          # retirées fin 2025.)
          - os: macos-latest
            cible: universal-apple-darwin
            rust_cibles: aarch64-apple-darwin,x86_64-apple-darwin
            paquets: app,dmg
          # Windows : installeur .exe (NSIS) seulement. Le .msi passe par
          # l'outil WiX, fragile sur les machines de GitHub, et ne sert
          # vraiment qu'aux déploiements en parc d'entreprise.
          - os: windows-latest
            cible: x86_64-pc-windows-msvc
            rust_cibles: x86_64-pc-windows-msvc
            paquets: nsis

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_cibles }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Les tests d'intégrité passent avant toute publication : on ne
      # distribue pas un outil de vérification qui n'a pas été vérifié.
      - name: Tests d'intégrité
        run: cargo test -p offload-core --all-targets

      - run: npm install
      - run: npm run build -- --target ${{ matrix.cible }} --bundles ${{ matrix.paquets }}

      - name: Attacher les installeurs à la publication
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/${{ matrix.cible }}/release/bundle/dmg/*.dmg
            target/${{ matrix.cible }}/release/bundle/nsis/*.exe

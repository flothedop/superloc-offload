name: Build et tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  moteur:
    name: Moteur — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check -p offload-core

      - name: Clippy
        run: cargo clippy -p offload-core --all-targets -- -D warnings

      # Les tests d'intégrité corrompent volontairement des copies : bit
      # retourné, fichier tronqué, segment de clip absent, disque qui tombe.
      # Ils vérifient aussi que la relecture contourne bien le cache du
      # système sur cette plateforme.
      - name: Tests d'intégrité
        run: cargo test -p offload-core --all-targets

  application:
    name: Application — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Un seul installeur Mac, universel : Intel et Apple Silicon.
          # (Les machines macos-13 de GitHub, seules à être Intel, ont été
          # retirées fin 2025.)
          - os: macos-latest
            cible: universal-apple-darwin
            rust_cibles: aarch64-apple-darwin,x86_64-apple-darwin
            paquets: app,dmg
          # Windows : installeur .exe (NSIS) seulement. Le .msi passe par
          # l'outil WiX, fragile sur les machines de GitHub, et ne sert
          # vraiment qu'aux déploiements en parc d'entreprise.
          - os: windows-latest
            cible: x86_64-pc-windows-msvc
            rust_cibles: x86_64-pc-windows-msvc
            paquets: nsis

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_cibles }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer l'outil Tauri
        run: npm install

      - name: Construire l'application
        run: npm run build -- --target ${{ matrix.cible }} --bundles ${{ matrix.paquets }}

      - name: Récupérer les installeurs
        uses: actions/upload-artifact@v4
        with:
          name: SuperLoc-Offload-${{ matrix.cible }}
          path: |
            target/${{ matrix.cible }}/release/bundle/dmg/*.dmg
            target/${{ matrix.cible }}/release/bundle/nsis/*.exe
          if-no-files-found: warn
